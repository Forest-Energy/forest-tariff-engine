[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forest-tariff-engine"
version = "1.27.0"
description = "South African electricity tariff engine (Eskom + municipalities). Shared between Forest Energy Solar Model and Solar Dashboard."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Forest Energy", email = "info@forestenergy.co.za" }]
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tariff_engine*"]

[tool.setuptools.package-data]
tariff_engine = ["tariff_data.json"]
